spring:
  application:
    name: MotivaFIt

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

    security:
      jwt:
        secret: ${JWT_SECRET}
        issuer: ${JWT_ISSUER}
        expiration-minutes: ${JWT_EXPIRATION_MINUTES}
        refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS}


